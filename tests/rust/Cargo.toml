[package]
name = "repository-tests"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "uuid", "chrono", "json", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "macros"] }

[dev-dependencies]
tempfile = "3"